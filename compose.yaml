services:
  ego-lite:
    build:
      context: .
    image: ego-lite-linux:local
    init: true
    stdin_open: true
    shm_size: 1gb
    environment:
      EGO_BROWSER_CHROMIUM_ARGS: ${EGO_BROWSER_CHROMIUM_ARGS:-}
      EGO_BROWSER_HANDOFF_IDLE_MS: ${EGO_BROWSER_HANDOFF_IDLE_MS:-600000}
      EGO_BROWSER_DELETE_IDLE_MS: ${EGO_BROWSER_DELETE_IDLE_MS:-3600000}
